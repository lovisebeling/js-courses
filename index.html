
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokédex | National Database</title>

    <link rel="stylesheet" href="./style.css">
    <script src="./js/poke.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="brand">
            <span class="brand-icon">◈</span>
            <div>
                <h1>POKÉDEX</h1>
                <p>NATIONAL DATABASE</p>
            </div>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            API ONLINE
        </div>
    </header>

    <main class="container">
        <section class="intro">
            <p class="eyebrow">DATABASE // 001</p>
            <h2>Explore the Pokémon world<span>.</span></h2>
            <p class="intro-text">
                Discover Pokémon species, stats and characteristics.
            </p>
        </section>

        <form id="search-form" class="search-form">
            <input
                id="search-input"
                type="search"
                placeholder="Search by name or Pokédex number..."
                aria-label="Search Pokémon by name or number"
            >
            <button type="submit" class="search-button">Search</button>
            <button type="button" id="clear-search" class="page-button">
                Show all
            </button>
        </form>

        <div class="display-options">
            <label class="family-toggle" for="group-families">
                <input type="checkbox" id="group-families">
                <span>Group by evolution families</span>
            </label>

            <p class="option-hint">
                National Pokédex numbers stay unchanged.
            </p>
        </div>

        <div class="toolbar">
            <p id="page-number">Loading...</p>
            <p id="result-count">Pokémon: --</p>
        </div>

        <section
            id="pokemon-list"
            class="pokemon-grid"
            aria-label="Pokémon list"
        >
            <p class="loading">Initializing database...</p>
        </section>

        <p id="error-message" class="error-message" role="alert"></p>


        <nav class="pagination" aria-label="Pagination">
            <button id="first-page" class="page-button" disabled>
                « First
            </button>

            <button id="previous" class="page-button" disabled>
                ← Previous
            </button>

            <input
                type="number"
                id="page-indicator"
                class="page-input"
                min="1"
                value="1"
                aria-label="Go to page"
            >

            <button id="next" class="page-button" disabled>
                Next →
            </button>

            <button id="last-page" class="page-button" disabled>
                Last »
            </button>
        </nav>

    </main>

    <footer>
        <p>PERSONAL POKÉDEX · POWERED BY POKÉAPI</p>
    </footer>
</body>
</html>
